<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>AgentNexus — Live Terminal</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.2/dist/ethers.umd.min.js"></script>
<style>
  :root { --bg:#0a0e14; --panel:#111823; --green:#22c55e; --red:#ef4444; --amber:#f59e0b; --text:#d1d5db; --dim:#6b7280; }
  * { margin:0; padding:0; box-sizing:border-box; font-family:Consolas,'Courier New',monospace; }
  body { background:var(--bg); color:var(--text); padding:24px; }
  header { display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #1f2937; padding-bottom:14px; margin-bottom:16px; }
  h1 { font-size:20px; color:#fff; letter-spacing:1px; }
  h1 span { color:var(--green); }
  .live { color:var(--green); font-size:12px; }
  .live .dot { display:inline-block; width:8px; height:8px; background:var(--green); border-radius:50%; margin-right:6px; animation:pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity:.3; } }
  .meta { color:var(--dim); font-size:12px; margin-bottom:14px; }
  #feed { background:var(--panel); border:1px solid #1f2937; border-radius:8px; padding:14px; height:62vh; overflow-y:auto; }
  .row { padding:8px 10px; border-left:3px solid transparent; margin-bottom:6px; font-size:13px; background:#0d1420; border-radius:4px; }
  .row .t { color:var(--dim); margin-right:10px; }
  .badge { font-weight:bold; margin-right:10px; }
  .ESCROW .badge { color:var(--amber); }   .ESCROW { border-left-color:var(--amber); }
  .ASSIGN .badge { color:#38bdf8; }        .ASSIGN { border-left-color:#38bdf8; }
  .COMPLETE .badge { color:var(--green); } .COMPLETE { border-left-color:var(--green); }
  .FIREWALL .badge { color:var(--red); }   .FIREWALL { border-left-color:var(--red); background:#1a0d0d; }
  body.alert { animation:flash .5s 4; }
  @keyframes flash { 50% { background:#3a0d0d; } }
</style>
</head>
<body>
<header>
  <h1>AGENT<span>NEXUS</span> // INSTITUTIONAL AGENT CLEARINGHOUSE</h1>
  <div class="live"><span class="dot"></span>LIVE — BSC TESTNET</div>
</header>
<div class="meta">VAULT: 0x547cdf0267f8d0ac238923531CBBAa7dF697CBEB &nbsp;|&nbsp; TOTAL TASKS: <span id="tasks">–</span></div>
<div id="feed"></div>

<script>
const RPC = "https://data-seed-prebsc-1-s1.bnbchain.org:8545";
const ADDRESS = "0x547cdf0267f8d0ac238923531CBBAa7dF697CBEB";
const ABI = [
  "event TaskCreated(uint256 indexed taskId, address indexed client, uint256 reward)",
  "event AgentAssigned(uint256 indexed taskId, address indexed agent, uint256 stakeLocked)",
  "event TaskCompleted(uint256 indexed taskId, address indexed agent, uint256 rewardPaid)",
  "event FirewallTriggered(uint256 indexed taskId, address indexed rogueAgent, uint256 slashedAmount, string reason)",
  "function taskCounter() view returns (uint256)"
];

const provider = new ethers.JsonRpcProvider(RPC);
const vault = new ethers.Contract(ADDRESS, ABI, provider);
const feed = document.getElementById("feed");
const short = a => a.slice(0, 6) + "…" + a.slice(-4);
const bnb = w => ethers.formatEther(w) + " BNB";

function addRow(type, text) {
  const div = document.createElement("div");
  div.className = "row " + type;
  div.innerHTML = `<span class="t">${new Date().toLocaleTimeString()}</span><span class="badge">${type}</span>${text}`;
  feed.prepend(div);
  if (type === "FIREWALL") {
    document.body.classList.add("alert");
    setTimeout(() => document.body.classList.remove("alert"), 2500);
  }
}

async function loadHistory() {
  const latest = await provider.getBlockNumber();
  const rows = [];
  let to = latest;
  for (let chunk = 0; chunk < 10 && to > 0; chunk++) {
    const from = Math.max(0, to - 9999);
    let created = [], assigned = [], completed = [], fired = [];
    try {
      [created, assigned, completed, fired] = await Promise.all([
        vault.queryFilter(vault.filters.TaskCreated(), from, to),
        vault.queryFilter(vault.filters.AgentAssigned(), from, to),
        vault.queryFilter(vault.filters.TaskCompleted(), from, to),
        vault.queryFilter(vault.filters.FirewallTriggered(), from, to),
      ]);
    } catch (err) {
      console.warn("Chunk skipped:", err.message);
      break; // keep whatever we already found
    }
    rows.push(
      ...created.map(e => ({ b: e.blockNumber, type: "ESCROW",    text: `Task #${e.args.taskId} escrowed — ${bnb(e.args.reward)} locked by ${short(e.args.client)}` })),
      ...assigned.map(e => ({ b: e.blockNumber, type: "ASSIGN",   text: `Agent ${short(e.args.agent)} staked ${bnb(e.args.stakeLocked)} on task #${e.args.taskId}` })),
      ...completed.map(e => ({ b: e.blockNumber, type: "COMPLETE",text: `Task #${e.args.taskId} settled — ${bnb(e.args.rewardPaid)} released` })),
      ...fired.map(e => ({ b: e.blockNumber, type: "FIREWALL",    text: `KILL SWITCH on task #${e.args.taskId} — ${bnb(e.args.slashedAmount)} slashed. Reason: ${e.args.reason}` }))
    );
    if (created.some(e => Number(e.args.taskId) === 1)) break;
    to = from - 1;
  }
  rows.sort((x, y) => x.b - y.b).forEach(r => addRow(r.type, r.text));
}

function listen() {
  vault.on("TaskCreated",     (taskId, client, reward) => addRow("ESCROW",    `Task #${taskId} escrowed — ${bnb(reward)} locked by ${short(client)}`));
  vault.on("AgentAssigned",   (taskId, agent, stake)   => addRow("ASSIGN",    `Agent ${short(agent)} staked ${bnb(stake)} on task #${taskId}`));
  vault.on("TaskCompleted",   (taskId, agent, paid)    => addRow("COMPLETE",  `Task #${taskId} settled — ${bnb(paid)} released`));
  vault.on("FirewallTriggered",(taskId, rogue, slashed, reason) => addRow("FIREWALL", `KILL SWITCH on task #${taskId} — ${bnb(slashed)} slashed from ${short(rogue)}. Reason: ${reason}`));
}

async function tick() {
  document.getElementById("tasks").textContent = (await vault.taskCounter()).toString();
}

loadHistory().then(listen).catch(e => addRow("FIREWALL", "Connection error: " + e.message));
tick(); setInterval(tick, 8000);
</script>
</body>
</html>
